<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Stundenzettel">
<meta name="theme-color" content="#134e4a">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png" type="image/png">
<link rel="apple-touch-icon" href="icon-192.png">
<title>Stundenzettel</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@600;700&family=Inter:wght@400;500;600;700&display=swap');
  :root {
    --teal-900:#134e4a; --teal-800:#115e59; --teal-700:#0f766e; --teal-600:#0d9488; --teal-100:#ccfbf1;
    --amber-700:#b45309;
    --stone-100:#f5f5f4; --stone-200:#e7e5e4; --stone-300:#d6d3d1; --stone-400:#a8a29e; --stone-500:#78716c; --stone-800:#292524;
    --red-600:#dc2626;
  }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--stone-100); font-family:'Inter',system-ui,sans-serif; color:var(--stone-800); -webkit-tap-highlight-color:transparent; }
  h1, h2 { font-family:'Space Grotesk',system-ui,sans-serif; margin:0; }
  header { background:var(--teal-900); color:#fff; position:sticky; top:0; z-index:20; box-shadow:0 2px 6px rgba(0,0,0,.15); }
  .topbar { display:flex; align-items:center; justify-content:space-between; padding:12px 16px; }
  .monthbar { display:flex; align-items:center; justify-content:space-between; padding:0 16px 12px; }
  .iconbtn { background:none; border:none; color:#fff; padding:8px; border-radius:999px; cursor:pointer; font-size:16px; line-height:1; }
  .iconbtn:hover { background:rgba(255,255,255,.12); }
  main { max-width:480px; margin:0 auto; padding:16px; padding-bottom:200px; }

  .cal-weekdays { display:grid; grid-template-columns:repeat(7,1fr); text-align:center; font-size:11px; color:var(--stone-500); margin-bottom:6px; text-transform:uppercase; letter-spacing:.03em; }
  .cal-grid { display:grid; grid-template-columns:repeat(7,1fr); gap:6px; margin-bottom:18px; }
  .cal-cell { aspect-ratio:1; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:2px; background:#fff; border:1px solid var(--stone-200); border-radius:10px; cursor:pointer; font-family:inherit; padding:2px; }
  .cal-cell-out { opacity:.4; }
  .cal-cell-today { border-color:var(--teal-700); border-width:2px; }
  .cal-cell-error { border-color:var(--red-600); }
  .cal-cell-selected { background:var(--teal-700); border-color:var(--teal-700); }
  .cal-cell-selected .cal-daynum { color:#fff; }
  .cal-daynum { font-size:13px; font-weight:600; color:var(--stone-800); }
  .cal-value { font-size:10px; font-weight:700; font-variant-numeric:tabular-nums; line-height:1; }

  .card { background:#fff; border:1px solid var(--stone-200); border-radius:14px; padding:14px 16px; margin-bottom:12px; box-shadow:0 1px 2px rgba(0,0,0,.04); }
  .card-head { display:flex; align-items:center; justify-content:space-between; margin-bottom:10px; }
  .day-name { font-weight:600; font-size:14px; }
  .day-date { font-size:12px; color:var(--stone-400); }
  .day-total { font-weight:600; font-size:14px; color:var(--teal-800); font-variant-numeric:tabular-nums; }
  .fields { display:grid; grid-template-columns:1fr 1fr 1fr; gap:8px; }
  .field label { font-size:11px; text-transform:uppercase; letter-spacing:.03em; color:var(--stone-500); display:block; margin-bottom:4px; }
  .field input, .field select { width:100%; border:1px solid var(--stone-300); border-radius:8px; padding:7px 8px; font-size:14px; font-family:inherit; background:#fff; }
  .field input:focus, .field select:focus { outline:2px solid var(--teal-600); outline-offset:-1px; border-color:var(--teal-600); }
  .field input:disabled { background:var(--stone-100); color:var(--stone-400); }
  .status-badge { font-size:11px; font-weight:600; padding:2px 9px; border-radius:999px; white-space:nowrap; }
  .day-error { font-size:12px; color:var(--red-600); margin-top:6px; }
  .input-error { border-color:var(--red-600) !important; }

  footer { position:fixed; bottom:0; left:0; right:0; background:#fff; border-top:1px solid var(--stone-200); box-shadow:0 -2px 10px rgba(0,0,0,.06); }
  .footer-inner { max-width:480px; margin:0 auto; padding:12px 16px 16px; }
  .totalrow { display:flex; align-items:baseline; justify-content:space-between; margin-bottom:8px; }
  .totalrow .label { font-size:11px; text-transform:uppercase; color:var(--stone-500); }
  .totalrow .value { font-size:20px; font-weight:700; color:var(--amber-700); font-variant-numeric:tabular-nums; }
  .btn-primary { display:flex; align-items:center; justify-content:center; gap:8px; width:100%; background:var(--teal-700); color:#fff; text-decoration:none; border:none; padding:13px; border-radius:12px; font-weight:600; font-size:15px; cursor:pointer; }
  .btn-primary:hover { background:var(--teal-800); }
  .btn-ghost { display:flex; align-items:center; justify-content:center; gap:6px; width:100%; background:none; border:none; color:var(--stone-500); font-size:12px; padding:7px; cursor:pointer; font-family:inherit; }
  .btn-ghost:hover { color:var(--teal-700); }
  .note { text-align:center; font-size:12px; color:var(--teal-700); margin-bottom:6px; display:none; }
  .error { font-size:12px; color:var(--red-600); margin-bottom:8px; display:none; }

  .overlay { position:fixed; inset:0; background:rgba(0,0,0,.4); z-index:30; display:none; align-items:flex-end; justify-content:center; }
  .overlay.open { display:flex; }
  .sheet { background:#fff; width:100%; max-width:420px; border-radius:16px 16px 0 0; max-height:85vh; overflow-y:auto; }
  .sheet-head { display:flex; align-items:center; justify-content:space-between; padding:16px 20px; border-bottom:1px solid var(--stone-200); }
  .sheet-body { padding:16px 20px; display:flex; flex-direction:column; gap:12px; }
  .sheet-body label { font-size:12px; color:var(--stone-500); display:block; margin-bottom:4px; }
  .sheet-body input { width:100%; border:1px solid var(--stone-300); border-radius:8px; padding:9px 10px; font-size:14px; font-family:inherit; }
  .sheet-foot { display:flex; gap:8px; padding:16px 20px; border-top:1px solid var(--stone-200); }
  .btn-cancel { flex:1; padding:11px; border-radius:10px; border:1px solid var(--stone-300); background:#fff; color:var(--stone-500); font-weight:600; cursor:pointer; font-family:inherit; }
  .btn-save { flex:1; padding:11px; border-radius:10px; border:none; background:var(--teal-700); color:#fff; font-weight:600; cursor:pointer; font-family:inherit; }
  .issue-list { margin:0; padding-left:18px; font-size:13px; color:var(--red-600); display:flex; flex-direction:column; gap:4px; }

  .menu { position:absolute; right:0; top:44px; background:#fff; border:1px solid var(--stone-200); border-radius:10px; box-shadow:0 4px 16px rgba(0,0,0,.12); overflow:hidden; display:none; z-index:25; min-width:180px; }
  .menu.open { display:block; }
  .menu button { width:100%; text-align:left; padding:12px 16px; background:none; border:none; font-size:14px; display:flex; align-items:center; gap:8px; cursor:pointer; color:var(--stone-800); font-family:inherit; }
  .menu button:hover { background:var(--stone-100); }
</style>
</head>
<body>
<header>
  <div class="topbar">
    <h1 style="font-size:18px;font-weight:700;">Stundenzettel</h1>
    <div style="position:relative;">
      <button class="iconbtn" id="menuBtn" aria-label="Menü">☰</button>
      <div class="menu" id="menu">
        <button id="adminMenuBtn">👤 Adminbereich</button>
      </div>
    </div>
  </div>
  <div class="monthbar">
    <button class="iconbtn" id="prevMonth" aria-label="Vorheriger Monat">‹</button>
    <div style="text-align:center;">
      <div style="font-size:15px;font-weight:600;" id="monthLabel">Monat –</div>
    </div>
    <button class="iconbtn" id="nextMonth" aria-label="Nächster Monat">›</button>
  </div>
</header>

<main>
  <div class="cal-weekdays">
    <div>Mo</div><div>Di</div><div>Mi</div><div>Do</div><div>Fr</div><div>Sa</div><div>So</div>
  </div>
  <div class="cal-grid" id="calendarGrid"></div>
  <div id="dayEditor"></div>
</main>

<footer>
  <div class="footer-inner">
    <div class="totalrow">
      <span class="label">Monatssumme</span>
      <span class="value" id="monthTotal">00:00 Std.</span>
    </div>
    <div class="error" id="sendError"></div>
    <a href="#" class="btn-primary" id="sendMailBtn">✉️ Per E-Mail senden</a>
    <button class="btn-ghost" id="copyBtn">⧉ E-Mail-Text kopieren (falls sich keine Mail-App öffnet)</button>
    <div class="note" id="copyNote"></div>
    <button class="btn-ghost" id="shareExcelBtn">📎 Excel-Datei herunterladen</button>
    <div class="note" id="shareNote"></div>
  </div>
</footer>

<div class="overlay" id="adminOverlay">
  <div class="sheet" id="adminSheet">
    <div class="sheet-head">
      <h2 style="font-size:16px;">Adminbereich</h2>
      <button class="iconbtn" style="color:#292524;" id="closeAdmin">✕</button>
    </div>
    <div class="sheet-body">
      <div><label>Vorname</label><input id="fVorname" type="text"></div>
      <div><label>Name</label><input id="fNachname" type="text"></div>
      <div><label>Personalnummer</label><input id="fPersonalnummer" type="text"></div>
      <div><label>E-Mail Empfänger (Arbeitgeber)</label><input id="fEmpfaenger" type="email"></div>
    </div>
    <div class="sheet-foot">
      <button class="btn-cancel" id="cancelAdmin">Abbrechen</button>
      <button class="btn-save" id="saveAdmin">Speichern</button>
    </div>
    <div class="note" id="adminNote" style="padding-bottom:12px;"></div>
  </div>
</div>

<div class="overlay" id="confirmOverlay">
  <div class="sheet" id="confirmSheet">
    <div class="sheet-head">
      <h2 style="font-size:16px;">Bitte kurz prüfen</h2>
      <button class="iconbtn" style="color:#292524;" id="closeConfirm">✕</button>
    </div>
    <div class="sheet-body">
      <div id="confirmMessage" style="font-size:14px;"></div>
      <ul class="issue-list" id="confirmIssueList"></ul>
    </div>
    <div class="sheet-foot">
      <button class="btn-cancel" id="confirmCancel">Abbrechen</button>
      <button class="btn-save" id="confirmProceed">Trotzdem fortfahren</button>
    </div>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script>
const DAY_LABELS = ["Montag","Dienstag","Mittwoch","Donnerstag","Freitag","Samstag","Sonntag"];
const MONTH_NAMES = ["Januar","Februar","März","April","Mai","Juni","Juli","August","September","Oktober","November","Dezember"];
const STATUS_META = {
  urlaub:    { label: "Urlaub",              bg: "#fef9c3", fg: "#ca8a04" },
  krankheit: { label: "Krankheit",           bg: "#fee2e2", fg: "#dc2626" },
  feiertag:  { label: "Feiertag",            bg: "#dbeafe", fg: "#2563eb" },
  unbezahlt: { label: "Unbezahlter Urlaub",  bg: "#e7e5e4", fg: "#57534e" }
};
const WORK_META = { bg: "#dcfce7", fg: "#16a34a" };
const STATUS_ABBR = { urlaub: "U", krankheit: "K", feiertag: "F", unbezahlt: "UU" };
const STORAGE_PREFIX = "stundenzettel_";

function pad(n){ return String(n).padStart(2,"0"); }
function toISODate(d){ return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`; }
function weekdayIndex(d){ return (d.getDay()+6)%7; } // Montag=0..Sonntag=6

function timeToMinutes(t){
  if(!t) return null;
  const parts = t.split(":");
  const h = Number(parts[0]), m = Number(parts[1]);
  if(Number.isNaN(h)||Number.isNaN(m)) return null;
  return h*60+m;
}
function computeDailyResult(entry){
  if (entry.status) return { minutes: 0, error: null };
  const start = timeToMinutes(entry.beginn);
  const end = timeToMinutes(entry.ende);
  const pause = Number(entry.pause) || 0;
  if (start === null || end === null) return { minutes: 0, error: null };
  const diff = end - start;
  if (diff < 0) return { minutes: 0, error: "Endzeit darf nicht vor der Beginnzeit liegen." };
  const total = diff - pause;
  return { minutes: total > 0 ? total : 0, error: null };
}
function computeDailyMinutes(entry){ return computeDailyResult(entry).minutes; }
function formatMinutes(min){
  const h = Math.floor(min/60), m = min%60;
  return `${pad(h)}:${pad(m)}`;
}
function formatMinutesCompact(min){
  const h = Math.floor(min/60), m = min%60;
  return `${h}:${pad(m)}`;
}
function emptyEntry(){ return { beginn:"", ende:"", pause:"", projekt:"", status:"" }; }

function dayKey(ds){ return STORAGE_PREFIX+"tag_"+ds; }
function loadDayEntry(ds){
  try {
    const raw = localStorage.getItem(dayKey(ds));
    return raw ? JSON.parse(raw) : emptyEntry();
  } catch(e){ return emptyEntry(); }
}
function saveDayEntry(ds, entry){
  try { localStorage.setItem(dayKey(ds), JSON.stringify(entry)); }
  catch(e){ console.error("Tag konnte nicht gespeichert werden", e); }
}

// Alte Wochen-Daten (Vorgängerversion) einmalig in das neue Tagesformat übernehmen
function migrateOldWeekData(){
  try {
    const prefix = STORAGE_PREFIX+"woche_";
    const keys = [];
    for (let i=0; i<localStorage.length; i++){
      const k = localStorage.key(i);
      if (k && k.indexOf(prefix) === 0) keys.push(k);
    }
    keys.forEach((k)=>{
      const mondayStr = k.substring(prefix.length);
      const monday = new Date(mondayStr+"T00:00:00");
      if (isNaN(monday.getTime())) return;
      let entries;
      try { entries = JSON.parse(localStorage.getItem(k)); } catch(e){ return; }
      if (!Array.isArray(entries)) return;
      entries.forEach((entry, i)=>{
        const d = new Date(monday);
        d.setDate(monday.getDate()+i);
        const ds = toISODate(d);
        if (!localStorage.getItem(dayKey(ds))){
          const normalized = { beginn:entry.beginn||"", ende:entry.ende||"", pause:entry.pause||"", projekt:entry.projekt||"", status:entry.status||"" };
          const hasData = normalized.beginn || normalized.ende || normalized.pause || normalized.projekt || normalized.status;
          if (hasData) saveDayEntry(ds, normalized);
        }
      });
    });
  } catch(e){ console.error("Migration fehlgeschlagen", e); }
}

function loadAdmin(){
  try {
    const raw = localStorage.getItem(STORAGE_PREFIX+"admin");
    if(raw) state.admin = JSON.parse(raw);
  } catch(e){ console.error("Adminbereich konnte nicht geladen werden", e); }
}

let state = { admin: { vorname:"", nachname:"", personalnummer:"", empfaengerEmail:"" } };
let viewMonth = new Date(); viewMonth.setDate(1); viewMonth.setHours(0,0,0,0);
let selectedDate = toISODate(new Date());

function getCalendarCells(monthDate){
  const year = monthDate.getFullYear(), month = monthDate.getMonth();
  const firstOfMonth = new Date(year, month, 1);
  const lastOfMonth = new Date(year, month+1, 0);
  const offset = weekdayIndex(firstOfMonth);
  const totalCells = Math.ceil((offset + lastOfMonth.getDate()) / 7) * 7;
  const gridStart = new Date(firstOfMonth);
  gridStart.setDate(firstOfMonth.getDate() - offset);
  const cells = [];
  for (let i=0; i<totalCells; i++){
    const d = new Date(gridStart);
    d.setDate(gridStart.getDate()+i);
    cells.push({ date:d, inMonth: d.getMonth()===month });
  }
  return cells;
}
function getMonthDates(monthDate){
  const year = monthDate.getFullYear(), month = monthDate.getMonth();
  const last = new Date(year, month+1, 0).getDate();
  const dates = [];
  for (let day=1; day<=last; day++) dates.push(new Date(year, month, day));
  return dates;
}

function renderMonthHeader(){
  document.getElementById("monthLabel").textContent = `${MONTH_NAMES[viewMonth.getMonth()]} ${viewMonth.getFullYear()}`;
}

function renderCalendar(){
  const cells = getCalendarCells(viewMonth);
  const todayStr = toISODate(new Date());
  const html = cells.map((c)=>{
    const ds = toISODate(c.date);
    const entry = loadDayEntry(ds);
    const result = computeDailyResult(entry);
    const meta = entry.status ? STATUS_META[entry.status] : null;
    const classes = ["cal-cell"];
    if(!c.inMonth) classes.push("cal-cell-out");
    if(ds === selectedDate) classes.push("cal-cell-selected");
    else if(ds === todayStr) classes.push("cal-cell-today");
    if(result.error) classes.push("cal-cell-error");
    let indicator = "";
    let cellStyle = "";
    if(ds !== selectedDate){
      if(entry.status){
        cellStyle = `background:${meta.bg};`;
        indicator = `<span class="cal-value" style="color:${meta.fg}">${STATUS_ABBR[entry.status]||""}</span>`;
      } else if(result.minutes > 0){
        cellStyle = `background:${WORK_META.bg};`;
        indicator = `<span class="cal-value" style="color:${WORK_META.fg}">${formatMinutesCompact(result.minutes)}</span>`;
      }
    }
    return `<button type="button" class="${classes.join(" ")}" data-date="${ds}" style="${cellStyle}">
      <span class="cal-daynum">${c.date.getDate()}</span>
      ${indicator}
    </button>`;
  }).join("");
  document.getElementById("calendarGrid").innerHTML = html;
}

function renderDayEditor(){
  const ds = selectedDate;
  const d = new Date(ds+"T00:00:00");
  const e = loadDayEntry(ds);
  const result = computeDailyResult(e);
  const disabled = e.status ? "disabled" : "";
  const meta = e.status ? STATUS_META[e.status] : null;
  document.getElementById("dayEditor").innerHTML = `
    <div class="card">
      <div class="card-head">
        <div>
          <div class="day-name">${DAY_LABELS[weekdayIndex(d)]}</div>
          <div class="day-date">${pad(d.getDate())}.${pad(d.getMonth()+1)}.${d.getFullYear()}</div>
        </div>
        <div style="display:flex;flex-direction:column;align-items:flex-end;gap:4px;">
          <span class="day-total" id="dayEditorTotal">${formatMinutes(result.minutes)} Std.</span>
          <span class="status-badge" id="dayEditorBadge" style="display:${meta?"inline-block":"none"};background:${meta?meta.bg:""};color:${meta?meta.fg:""};">${meta?meta.label:""}</span>
        </div>
      </div>
      <div class="fields">
        <div class="field"><label>Beginn</label><input type="time" id="fBeginn" value="${e.beginn||""}" ${disabled}></div>
        <div class="field"><label>Ende</label><input type="time" id="fEnde" value="${e.ende||""}" ${disabled} class="${result.error?"input-error":""}"></div>
        <div class="field"><label>Pause (Min)</label><input type="number" min="0" step="5" placeholder="0" id="fPause" value="${e.pause||""}" ${disabled}></div>
      </div>
      <div class="day-error" id="dayEditorError" style="display:${result.error?"block":"none"};">${result.error||""}</div>
      <div class="field" style="margin-top:8px;"><label>Projekt</label><input type="text" id="fProjekt" value="${e.projekt||""}" placeholder="z. B. Musterstraße 12"></div>
      <div class="field" style="margin-top:8px;">
        <label>Status</label>
        <select id="fStatus">
          <option value="" ${!e.status?"selected":""}>Arbeitstag</option>
          <option value="urlaub" ${e.status==="urlaub"?"selected":""}>Urlaub</option>
          <option value="krankheit" ${e.status==="krankheit"?"selected":""}>Krankheit</option>
          <option value="feiertag" ${e.status==="feiertag"?"selected":""}>Feiertag</option>
          <option value="unbezahlt" ${e.status==="unbezahlt"?"selected":""}>Unbezahlter Urlaub</option>
        </select>
      </div>
      <div class="note" id="dayEditorNote">Gespeichert ✓</div>
    </div>`;
  ["fBeginn","fEnde","fPause","fProjekt"].forEach((id)=>{
    document.getElementById(id).addEventListener("input", onDayFieldChange);
  });
  document.getElementById("fStatus").addEventListener("change", onDayFieldChange);
}

let savedNoteTimer = null;
function onDayFieldChange(){
  const entry = {
    beginn: document.getElementById("fBeginn").value,
    ende: document.getElementById("fEnde").value,
    pause: document.getElementById("fPause").value,
    projekt: document.getElementById("fProjekt").value,
    status: document.getElementById("fStatus").value,
  };
  saveDayEntry(selectedDate, entry);

  const result = computeDailyResult(entry);
  document.getElementById("dayEditorTotal").textContent = formatMinutes(result.minutes)+" Std.";
  const errBox = document.getElementById("dayEditorError");
  const endeInput = document.getElementById("fEnde");
  if(result.error){ errBox.textContent=result.error; errBox.style.display="block"; endeInput.classList.add("input-error"); }
  else { errBox.style.display="none"; endeInput.classList.remove("input-error"); }

  const disable = !!entry.status;
  document.getElementById("fBeginn").disabled = disable;
  document.getElementById("fEnde").disabled = disable;
  document.getElementById("fPause").disabled = disable;

  const badge = document.getElementById("dayEditorBadge");
  const meta = STATUS_META[entry.status];
  if(meta){ badge.textContent=meta.label; badge.style.background=meta.bg; badge.style.color=meta.fg; badge.style.display="inline-block"; }
  else badge.style.display="none";

  const note = document.getElementById("dayEditorNote");
  note.style.display = "block";
  clearTimeout(savedNoteTimer);
  savedNoteTimer = setTimeout(()=>{ note.style.display="none"; }, 1200);

  renderCalendar();
  updateMonthTotal();
  updateSendLink();
}

function selectDate(ds){
  const d = new Date(ds+"T00:00:00");
  if(d.getMonth() !== viewMonth.getMonth() || d.getFullYear() !== viewMonth.getFullYear()){
    viewMonth = new Date(d.getFullYear(), d.getMonth(), 1);
  }
  selectedDate = ds;
  renderMonthHeader();
  renderCalendar();
  renderDayEditor();
  updateMonthTotal();
  updateSendLink();
}

function updateMonthTotal(){
  const total = getMonthDates(viewMonth).reduce((sum,d)=>sum+computeDailyMinutes(loadDayEntry(toISODate(d))),0);
  document.getElementById("monthTotal").textContent = formatMinutes(total)+" Std.";
}

document.getElementById("calendarGrid").addEventListener("click",(ev)=>{
  const btn = ev.target.closest(".cal-cell");
  if(!btn) return;
  selectDate(btn.dataset.date);
});
document.getElementById("prevMonth").addEventListener("click", ()=>{
  const d = new Date(viewMonth); d.setMonth(d.getMonth()-1);

// ---- Monatsübersicht: Text für E-Mail, Datei-Export ----

function buildBodyText(){
  const dates = getMonthDates(viewMonth);
  const lines = [];
  lines.push(`Stundenuebersicht ${MONTH_NAMES[viewMonth.getMonth()]} ${viewMonth.getFullYear()}`);
  lines.push(`${state.admin.vorname} ${state.admin.nachname}${state.admin.personalnummer ? " (Personalnr. "+state.admin.personalnummer+")" : ""}`);
  lines.push("");
  lines.push("Tag          Datum   Beginn  Ende   Pause   Gesamt  Projekt          Abwesenheitsgrund");
  let totalMin = 0;
  const counts = { urlaub:0, krankheit:0, feiertag:0, unbezahlt:0 };
  dates.forEach((d)=>{
    const ds = toISODate(d);
    const e = loadDayEntry(ds);
    const result = computeDailyResult(e);
    totalMin += result.minutes;
    if(e.status && counts.hasOwnProperty(e.status)) counts[e.status]++;
    const tag = DAY_LABELS[weekdayIndex(d)].padEnd(12," ");
    const datum = `${pad(d.getDate())}.${pad(d.getMonth()+1)}.`.padEnd(7," ");
    const beginn = (e.beginn||"--:--").padEnd(7," ");
    const ende = (e.ende||"--:--").padEnd(6," ");
    const pause = ((e.pause||"0")+" Min").padEnd(7," ");
    const gesamt = formatMinutes(result.minutes).padEnd(7," ");
    const projekt = (e.projekt||"").padEnd(16," ");
    const abwesenheit = e.status && STATUS_META[e.status] ? STATUS_META[e.status].label : "";
    lines.push(`${tag} ${datum} ${beginn} ${ende} ${pause} ${gesamt} ${projekt} ${abwesenheit}`);
  });
  lines.push("");
  lines.push(`Monatssumme Arbeitsstunden: ${formatMinutes(totalMin)} Std.`);
  const tagWort = (n)=> n===1 ? "Tag" : "Tage";
  lines.push(`Monatssumme Urlaub: ${counts.urlaub} ${tagWort(counts.urlaub)}`);
  lines.push(`Monatssumme Krankheit: ${counts.krankheit} ${tagWort(counts.krankheit)}`);
  lines.push(`Monatssumme Feiertag: ${counts.feiertag} ${tagWort(counts.feiertag)}`);
  lines.push(`Monatssumme Unbezahlter Urlaub: ${counts.unbezahlt} ${tagWort(counts.unbezahlt)}`);
  return lines.join("\n");
}

function updateSendLink(){
  const subject = `Stundenuebersicht ${MONTH_NAMES[viewMonth.getMonth()]} ${viewMonth.getFullYear()} - ${state.admin.vorname} ${state.admin.nachname}`;
  const body = buildBodyText();
  const link = document.getElementById("sendMailBtn");
  if(state.admin.empfaengerEmail){
    link.href = `mailto:${encodeURIComponent(state.admin.empfaengerEmail)}?subject=${encodeURIComponent(subject)}&body=${encodeURIComponent(body)}`;
  } else {
    link.href = "#";
  }
}

// ---- Prüfung vor dem Versand/Export ----

function validateMonthData(){
  const dates = getMonthDates(viewMonth);
  const issues = [];
  let hasAnyData = false;
  dates.forEach((d)=>{
    const ds = toISODate(d);
    const e = loadDayEntry(ds);
    const hasAny = e.beginn || e.ende || e.pause || e.projekt || e.status;
    if(hasAny) hasAnyData = true;
    const label = `${DAY_LABELS[weekdayIndex(d)]}, ${pad(d.getDate())}.${pad(d.getMonth()+1)}.`;
    const result = computeDailyResult(e);
    if(result.error){
      issues.push(`${label}: ${result.error}`);
      return;
    }
    if(!e.status){
      if((e.beginn && !e.ende) || (!e.beginn && e.ende)){
        issues.push(`${label}: Beginn oder Ende fehlt noch.`);
      } else if(e.beginn && e.ende){
        const start = timeToMinutes(e.beginn), end = timeToMinutes(e.ende), pause = Number(e.pause)||0;
        if(end - start - pause < 0) issues.push(`${label}: Pause ist länger als die Arbeitszeit.`);
      }
    }
  });
  return { issues, hasAnyData };
}

let pendingAction = null;
function openConfirm(message, issues){
  document.getElementById("confirmMessage").textContent = message;
  document.getElementById("confirmIssueList").innerHTML = issues.map(i=>`<li>${i}</li>`).join("");
  document.getElementById("confirmOverlay").classList.add("open");
}
function closeConfirmOverlay(){
  document.getElementById("confirmOverlay").classList.remove("open");
  pendingAction = null;
}
document.getElementById("confirmProceed").addEventListener("click", ()=>{
  const action = pendingAction;
  document.getElementById("confirmOverlay").classList.remove("open");
  pendingAction = null;
  if(action) action();
});
document.getElementById("confirmCancel").addEventListener("click", closeConfirmOverlay);
document.getElementById("closeConfirm").addEventListener("click", closeConfirmOverlay);
document.getElementById("confirmOverlay").addEventListener("click", closeConfirmOverlay);
document.getElementById("confirmSheet").addEventListener("click",(e)=>e.stopPropagation());

function runWithValidation(actionFn){
  const { issues, hasAnyData } = validateMonthData();
  if(!hasAnyData){
    pendingAction = actionFn;
    openConfirm("Für diesen Monat wurden noch keine Stunden erfasst. Trotzdem fortfahren?", []);
    return;
  }
  if(issues.length){
    pendingAction = actionFn;
    openConfirm("Es gibt noch offene Punkte für diesen Monat:", issues);
    return;
  }
  actionFn();
}

document.getElementById("copyBtn").addEventListener("click", async ()=>{
  const subject = `Stundenuebersicht ${MONTH_NAMES[viewMonth.getMonth()]} ${viewMonth.getFullYear()} - ${state.admin.vorname} ${state.admin.nachname}`;
  const text = `An: ${state.admin.empfaengerEmail || "(keine Empfänger-E-Mail hinterlegt)"}\nBetreff: ${subject}\n\n${buildBodyText()}`;
  const note = document.getElementById("copyNote");
  let ok = false;
  try {
    await navigator.clipboard.writeText(text);
    ok = true;
  } catch(e){
    try {
      const ta = document.createElement("textarea");
      ta.value = text;
      ta.style.position = "fixed";
      ta.style.opacity = "0";
      document.body.appendChild(ta);
      ta.focus(); ta.select();
      ok = document.execCommand("copy");
      document.body.removeChild(ta);
    } catch(e2){ ok = false; }
  }
  note.textContent = ok ? "In Zwischenablage kopiert – jetzt in der Mail-App einfügen." : "Kopieren nicht möglich – bitte Text manuell markieren.";
  note.style.display = "block";
  setTimeout(()=> note.style.display="none", 2500);
});

// ---- Excel-Export ----

function buildWorkbookBlob(){
  const dates = getMonthDates(viewMonth);
  const rows = [
    ["Stundenübersicht"],
    [`${state.admin.vorname} ${state.admin.nachname}`, state.admin.personalnummer?`Personalnr. ${state.admin.personalnummer}`:""],
    [`${MONTH_NAMES[viewMonth.getMonth()]} ${viewMonth.getFullYear()}`],
    [],
    ["Tag","Datum","Beginn","Ende","Pause (Min)","Gesamt (Std)","Projekt","Abwesenheitsgrund"]
  ];
  let totalMin = 0;
  const counts = { urlaub:0, krankheit:0, feiertag:0, unbezahlt:0 };
  dates.forEach((d)=>{
    const ds = toISODate(d);
    const e = loadDayEntry(ds);
    const result = computeDailyResult(e);
    totalMin += result.minutes;
    if(e.status && counts.hasOwnProperty(e.status)) counts[e.status]++;
    const abwesenheit = e.status && STATUS_META[e.status] ? STATUS_META[e.status].label : "";
    rows.push([DAY_LABELS[weekdayIndex(d)], ds, e.beginn||"", e.ende||"", e.pause||"0", formatMinutes(result.minutes), e.projekt||"", abwesenheit]);
  });
  rows.push([]);
  rows.push(["Monatssumme Arbeitsstunden","","","","",formatMinutes(totalMin),"",""]);
  const tagWort = (n)=> n===1 ? "Tag" : "Tage";
  rows.push([`Monatssumme Urlaub`, `${counts.urlaub} ${tagWort(counts.urlaub)}`]);
  rows.push([`Monatssumme Krankheit`, `${counts.krankheit} ${tagWort(counts.krankheit)}`]);
  rows.push([`Monatssumme Feiertag`, `${counts.feiertag} ${tagWort(counts.feiertag)}`]);
  rows.push([`Monatssumme Unbezahlter Urlaub`, `${counts.unbezahlt} ${tagWort(counts.unbezahlt)}`]);
  const filename = `Stundenzettel_${state.admin.nachname||"Mitarbeiter"}_${MONTH_NAMES[viewMonth.getMonth()]}_${viewMonth.getFullYear()}.xlsx`;

  if (typeof XLSX === "undefined") return { blob: null, filename };

  const ws = XLSX.utils.aoa_to_sheet(rows);
  ws["!cols"] = [{wch:14},{wch:12},{wch:8},{wch:8},{wch:12},{wch:12},{wch:16},{wch:18}];
  const wb = XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb, ws, "Monat");
  const wbout = XLSX.write(wb, {bookType:"xlsx", type:"array"});
  const blob = new Blob([wbout], {type:"application/vnd.openxmlformats-officedocument.spreadsheetml.sheet"});
  return { blob, filename };
}

function downloadBlob(blob, filename){
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url; a.download = filename;
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
  setTimeout(()=>URL.revokeObjectURL(url), 3000);
}

document.getElementById("shareExcelBtn").addEventListener("click", ()=>{
  runWithValidation(proceedWithExcelDownload);
});
async function proceedWithExcelDownload(){
  const note = document.getElementById("shareNote");
  const {blob, filename} = buildWorkbookBlob();
  if (!blob){
    note.textContent = "Excel-Bibliothek konnte nicht geladen werden (Internetverbindung prüfen) – bitte erneut versuchen.";
    note.style.color = "var(--red-600)";
    note.style.display = "block";
    return;
  }

  const file = new File([blob], filename, {type: blob.type});
  if (navigator.canShare && navigator.canShare({files:[file]})){
    try {
      const subject = `Stundenuebersicht ${MONTH_NAMES[viewMonth.getMonth()]} ${viewMonth.getFullYear()} - ${state.admin.vorname} ${state.admin.nachname}`;
      await navigator.share({files:[file], title: subject, text: buildBodyText()});
      return;
    } catch(e){
      if (e && e.name === "AbortError") return;
    }
  }

  downloadBlob(blob, filename);
  note.textContent = `Datei "${filename}" heruntergeladen – jetzt in deiner Mail-App als Anhang auswählen.`;
  note.style.color = "var(--teal-700)";
  note.style.display = "block";
  setTimeout(()=> note.style.display="none", 4500);
}
